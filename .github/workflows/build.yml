name: Ultimate Native Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Pure Android WebView APK
        run: |
          echo "Locating and extracting zip..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          mkdir -p web_content
          if [ -n "$UNZIP_FILE" ]; then
            unzip -q "$UNZIP_FILE" -d web_content
          else
            cp -r * web_content/ 2>/dev/null || true
          fi

          mkdir -p android-project/app/src/main/assets/www
          mkdir -p android-project/app/src/main/java/com/mql5/eastudio
          mkdir -p android-project/app/src/main/res/values

          SUB_FOLDER=$(ls -F web_content | grep '/' | head -n 1)
          ITEM_COUNT=$(ls -A web_content | wc -l)
          
          if [ "$ITEM_COUNT" -eq 1 ] && [ -n "$SUB_FOLDER" ]; then
            cp -r web_content/$SUB_FOLDER/* android-project/app/src/main/assets/www/ 2>/dev/null || true
          else
            cp -r web_content/* android-project/app/src/main/assets/www/ 2>/dev/null || true
          fi

          if [ ! -f "android-project/app/src/main/assets/www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>MQL5 EA Studio</title></head><body><h1>MQL5 EA Studio App</h1></body></html>' > android-project/app/src/main/assets/www/index.html
          fi

          cd android-project

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mql5.eastudio">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="MQL5 EA Studio"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/mql5/eastudio/MainActivity.java
          package com.mql5.eastudio;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView myWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  myWebView = new WebView(this);
                  WebSettings webSettings = myWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  
                  myWebView.setWebViewClient(new WebViewClient());
                  myWebView.loadUrl("file:///android_asset/www/index.html");
                  setContentView(myWebView);
              }

              @Override
              public void onBackPressed() {
                  if (myWebView.canGoBack()) {
                      myWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mql5.eastudio'
              compileSdk 33

              defaultConfig {
                  applicationId "com.mql5.eastudio"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          export PATH=$PATH:$PWD
          gradle wrapper --gradle-version 8.1.1
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mql5-ea-studio-apk
          path: |
            android-project/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
