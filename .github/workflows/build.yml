name: Ultimate Auto-Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build APK with exact zip preservation
        run: |
          echo "Locating source zip file..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          mkdir -p extracted_source
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d extracted_source
          else
            echo "No zip found, copying repository files..."
            cp -r * extracted_source/ 2>/dev/null || true
          fi

          npx cordova create build-workspace com.mql5.eastudio MQL5EAStudio
          cd build-workspace

          # Remove default www completely
          rm -rf www

          # Directly copy the extracted source folder as the new www directory to preserve 100% original structure
          if [ -d "../extracted_source" ]; then
            # Check if there is a single top-level folder inside extracted_source
            SUB_FOLDER=$(ls -F ../extracted_source | grep '/' | head -n 1)
            ITEM_COUNT=$(ls -A ../extracted_source | wc -l)
            
            if [ "$ITEM_COUNT" -eq 1 ] && [ -n "$SUB_FOLDER" ]; then
              cp -r ../extracted_source/$SUB_FOLDER .
              mv $(basename "$SUB_FOLDER") www
            else
              mkdir -p www
              cp -r ../extracted_source/* www/
            fi
          fi

          # Absolute safety check: if for some weird reason index.html is missing, inform build log instead of overriding
          if [ ! -f "www/index.html" ]; then
            echo "WARNING: index.html not found in root of extracted files, checking subdirectories..."
            FOUND_HTML=$(find www -name "index.html" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              echo "Found index.html at $FOUND_HTML"
            fi
          fi

          npx cordova platform add android --nosave || true
          npx cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mql5-ea-studio-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
