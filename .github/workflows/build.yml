name: Ultimate Auto-Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build APK with fixed config and web path
        run: |
          echo "Locating source zip file..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          mkdir -p extracted_source
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d extracted_source
          else
            echo "No zip found, copying repository files..."
            cp -r * extracted_source/ 2>/dev/null || true
          fi

          npx cordova create build-workspace com.mql5.eastudio MQL5EAStudio
          cd build-workspace

          # Clear default www folder completely
          rm -rf www/*

          # Safely copy extracted files directly into www
          if [ -d "../extracted_source" ]; then
            SUB_FOLDER=$(ls -F ../extracted_source | grep '/' | head -n 1)
            ITEM_COUNT=$(ls -A ../extracted_source | wc -l)
            
            if [ "$ITEM_COUNT" -eq 1 ] && [ -n "$SUB_FOLDER" ]; then
              cp -r ../extracted_source/$SUB_FOLDER/* www/ 2>/dev/null || true
            else
              cp -r ../extracted_source/* www/ 2>/dev/null || true
            fi
          fi

          # Ensure index.html exists in www root
          if [ ! -f "www/index.html" ]; then
            echo "WARNING: index.html not directly in root, searching..."
            FOUND_HTML=$(find www -name "index.html" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              DIR_NAME=$(dirname "$FOUND_HTML")
              if [ "$DIR_NAME" != "www" ]; then
                cp -r "$DIR_NAME"/* www/ 2>/dev/null || true
              fi
            fi
          fi

          # Fix config.xml to ensure proper asset loading
          if [ -f "config.xml" ]; then
            sed -i 's|<content src="index.html" />|<content src="index.html" />|g' config.xml
          fi

          npx cordova platform add android --nosave || true
          npx cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mql5-ea-studio-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
